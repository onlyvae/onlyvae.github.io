---
layout: default
title: 首页
---

<div class="post-list">
  {% for post in site.posts %}
  <article class="post-summary">
    <time class="post-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: site.date_format }}</time>
    <h2><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2>
    {{ post.excerpt }}
    <!-- <a href="{{ post.url | relative_url }}">阅读全文 →</a> -->
  </article>
  {% else %}
  <p>第一篇文章正在路上。</p>
  {% endfor %}
</div>
